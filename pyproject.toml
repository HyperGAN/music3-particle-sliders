[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "music3-particle-sliders"
version = "0.4.0"
description = "Product-owned Music3 native adapters over model-independent ParticleGAN core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@9e9dcea567b38a550bd50e2fea5c2fc3e669706c#subdirectory=packages/particle-sliders-core"]

[project.optional-dependencies]
response-fixture = ["transformers==5.15.0"]
native-source = ["torch==2.9.1", "transformers==5.15.0", "huggingface-hub==1.27.0", "safetensors==0.8.0", "numpy==2.2.6", "tokenizers==0.22.2", "diffusers @ git+https://github.com/huggingface/diffusers.git@d5baa4fb548294f47dbca49890abd4b291204c60"]
test = ["pytest>=8", "safetensors>=0.4,<1", "PyYAML>=6,<7"]

[project.entry-points."particle_sliders.response_backends"]
music3 = "music3.lifecycle:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
music3 = "music3.lifecycle:INFERENCE"

[tool.setuptools.packages.find]
include = ["music3*"]

[tool.setuptools.package-data]
music3 = ["response-core.lock.json", "data/*.json", "native-assets.lock.json", "native-provenance.json"]
