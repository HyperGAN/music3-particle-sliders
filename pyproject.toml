[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "music3-particle-sliders"
version = "0.2.0"
description = "Music3 native AR numerical response sessions; PG0.9.4 response cohort"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@8ffca928550f97fdb9713151ca3023fc71e77e2c#subdirectory=packages/particle-sliders-core"]

[project.optional-dependencies]
response-fixture = ["transformers==5.15.0"]
test = ["pytest>=8"]

[project.entry-points."particle_sliders.response_backends"]
music3 = "music3.lifecycle:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
music3 = "music3.lifecycle:INFERENCE"

[tool.setuptools.packages.find]
include = ["music3*"]

[tool.setuptools.package-data]
music3 = ["response-core.lock.json", "data/*.json"]
